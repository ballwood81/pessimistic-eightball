[platformio]
default_envs = xiao_nrf52840_sense
; ponytail: OneDrive races .pio object dirs; keep build off sync
build_dir = C:/ebuild/pesimistic-eightball

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

[env:xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#6a313a19f06994909627250a5e082e637bd34ff6
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
extra_scripts = pre:patch_libs.py
; BOARD_SCREEN_COMBO=501 required — Seeed_GFX defaults XIAO nRF to 666/ILI9341
; USE_TFT_ESPI_LIBRARY selects TFT path inside Seeed Round Display header
build_flags =
    -DBOARD_SCREEN_COMBO=501
    -DUSE_TFT_ESPI_LIBRARY
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd71
    https://github.com/Seeed-Studio/Seeed_Arduino_LSM6DS3.git#4ceed57
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git#v2.1.5
    lvgl/lvgl@8.3.11
    https://github.com/Seeed-Studio/Seeed_Arduino_RoundDisplay.git
lib_ignore =
    lv_examples
    GFX Library for Arduino
    AnimatedGIF

[env:xiao_tests]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#6a313a19f06994909627250a5e082e637bd34ff6
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
test_framework = unity
test_filter = test_logic
build_flags =
    -Iinclude
